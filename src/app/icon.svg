<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The site icon: the brand's first letter, outlined from Inter Bold, white
       on a near-black tile. A path, not a text element, so every device draws
       the same letter. Renaming the brand means redrawing this letter. -->
  <style>
    /* In a dark browser tab bar, a light edge keeps the dark tile visible. */
    .edge { display: none; }
    @media (prefers-color-scheme: dark) { .edge { display: inline; } }
  </style>
